    <style>
      /* loader styles inline so it paints instantly */
      #loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#f5e6d0;color:#241509;font-family:Georgia,serif;will-change:transform}
      html[data-theme=dark] #loader{background:#0b0c1f;color:#f4ead9}
      .ld-inner{text-align:center;padding:0 24px}
      .ld-word{font-size:clamp(44px,9vw,96px);line-height:1.15;min-height:1.2em;letter-spacing:-.01em;font-family:'Fraunces','Tiro Devanagari Hindi',Georgia,'Hiragino Sans','Geeza Pro','Noto Sans Arabic',serif}
      .ld-word::before{content:'';display:inline-block;width:.16em;height:.16em;border-radius:50%;background:#b4441c;margin:0 .3em;vertical-align:.25em}
      html[data-theme=dark] .ld-word::before{background:#f2aa48}
      .ld-sub{margin-top:14px;font:600 12px/1.4 Manrope,Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
      .ld-bar{width:160px;height:2px;margin:22px auto 0;background:rgba(127,127,127,.25);border-radius:2px;overflow:hidden}
      .ld-bar i{display:block;height:100%;background:#b4441c;transform-origin:0 50%;transform:scaleX(0);transition:transform .4s}
      html[data-theme=dark] .ld-bar i{background:#f2aa48}
      .seo-plain{position:relative;z-index:5;max-width:780px;margin:0 auto;padding:48px 22px;font:16px/1.7 Manrope,Arial,sans-serif;background:#f5e6d0;color:#241509}
      .seo-plain h1,.seo-plain h2{font-family:Fraunces,Georgia,serif;font-weight:400;margin:28px 0 8px}
    </style>
    <noscript><style>#loader{display:none}</style></noscript>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading">
      <div class="ld-inner">
        <p class="ld-word" id="ld-word" lang="hi">नमस्ते</p>
        <p class="ld-sub">Piyush Assudani · Balotra</p>
        <div class="ld-bar"><i></i></div>
      </div>
    </div>
    <script>
      // first paint follows the visitor's clock (main.ts refines it with real sunrise/sunset times)
      (function () {
        var h = new Date().getHours();
        document.documentElement.dataset.theme = h >= 19 || h < 6 ? 'dark' : 'light';
        // hello in a few languages while the desert loads, ending on Rajasthan's own "khamma ghani"
        var words = [['नमस्ते', 'hi'], ['Hello', 'en'], ['Bonjour', 'fr'], ['Hola', 'es'], ['Ciao', 'it'], ['こんにちは', 'ja'], ['Olá', 'pt'], ['مرحبا', 'ar'], ['Hallo', 'de'], ['खम्मा घणी', 'hi']];
        var el = document.getElementById('ld-word'), i = 0;
        window.__greet = new Promise(function (done) {
          var t = setInterval(function () {
            i++;
            el.textContent = words[i][0];
            el.lang = words[i][1];
            el.dir = words[i][1] === 'ar' ? 'rtl' : 'ltr';
            if (i === words.length - 1) { clearInterval(t); setTimeout(done, 380); }
          }, 125);
        });
      })();
    </script>
    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="app"></div>
